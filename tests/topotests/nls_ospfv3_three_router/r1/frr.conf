frr version 10
frr defaults traditional
hostname r1
service integrated-vtysh-config
!
interface r1-eth0
 ipv6 address 2001:db8:12::1/64
 ipv6 ospf6 area 0.0.0.0
!
interface r1-eth1
 ipv6 address 2001:db8:1::1/64
!
interface lo
 ipv6 address 2001:db8:1::1/128
!
router ospf6
 ospf6 router-id 10.255.0.1
!
