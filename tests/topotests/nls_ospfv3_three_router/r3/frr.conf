frr version 10
frr defaults traditional
hostname r3
service integrated-vtysh-config
!
interface r3-eth0
 ipv6 address 2001:db8:23::3/64
 ipv6 ospf6 area 0.0.0.0
!
interface r3-eth1
 ipv6 address 2001:db8:3::3/64
!
interface lo
 ipv6 address 2001:db8:3::3/128
 ipv6 ospf6 area 0.0.0.0
!
router ospf6
 ospf6 router-id 10.255.0.3
!
