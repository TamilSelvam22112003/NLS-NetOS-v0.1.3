frr version 10
frr defaults traditional
hostname r2
service integrated-vtysh-config
!
interface r2-eth0
 ipv6 address 2001:db8:12::2/64
 ipv6 ospf6 area 0.0.0.0
!
interface r2-eth1
 ipv6 address 2001:db8:23::2/64
 ipv6 ospf6 area 0.0.0.0
!
interface lo
 ipv6 address 2001:db8:2::2/128
!
router ospf6
 ospf6 router-id 10.255.0.2
!
