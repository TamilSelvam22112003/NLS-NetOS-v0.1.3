name: Router-CA VIP provisioning checks

on:
  push:
    branches: [main, feat/router-ca-vip-identity]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  router-ca-vip:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Validate Python syntax
        run: python3 -m py_compile scripts/generate-router-ca-vip.py

      - name: Test ULA derivation, metadata, permissions, and idempotency
        shell: bash
        run: |
          set -euo pipefail
          TEST_ROOT="$(mktemp -d)"
          trap 'sudo rm -rf "$TEST_ROOT"' EXIT
          cat > "$TEST_ROOT/home-ca-metadata.json" <<'JSON'
          {"schema_version":1,"ca_id":"CI-HOME-CA","trust":{"trust_status":"PENDING"}}
          JSON
          sudo python3 scripts/generate-router-ca-vip.py \
            --metadata "$TEST_ROOT/home-ca-metadata.json" \
            --key-output "$TEST_ROOT/crypto/sha-512/r-ca-vip.key" \
            --record-output "$TEST_ROOT/home-ca-vip.json"
          VIP="$(sudo cat "$TEST_ROOT/crypto/sha-512/r-ca-vip.key")"
          sudo python3 -c 'import ipaddress,sys; a=ipaddress.IPv6Address(sys.argv[1]); assert a in ipaddress.IPv6Network("fc00::/7")' "$VIP"
          test "$(sudo stat -c %a "$TEST_ROOT/crypto/sha-512/r-ca-vip.key")" = 600
          sudo python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); assert d["algorithm"]=="SHA-512" and d["validity_seconds"]==86400 and d["issued_at"] and d["expires_at"] and d["nonce_hex"]' "$TEST_ROOT/home-ca-vip.json"
          sudo python3 scripts/generate-router-ca-vip.py \
            --metadata "$TEST_ROOT/home-ca-metadata.json" \
            --key-output "$TEST_ROOT/crypto/sha-512/r-ca-vip.key" \
            --record-output "$TEST_ROOT/home-ca-vip.json"
          test "$VIP" = "$(sudo cat "$TEST_ROOT/crypto/sha-512/r-ca-vip.key")"
