name: NLS-NetOS Debian package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout repository and FRR submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build FRRouting
        run: sudo ./scripts/build-frr.sh

      - name: Build Debian package
        run: sudo bash ./packaging/build-deb.sh

      - name: Validate package metadata and contents
        run: |
          DEB="$(find build/packages -name '*.deb' -print -quit)"
          test -n "$DEB"
          dpkg-deb --info "$DEB"
          dpkg-deb --contents "$DEB" | grep -E 'usr/lib/frr/(zebra|ospfd|ospf6d)'
          dpkg-deb --contents "$DEB" | grep -E 'lib/systemd/system/frr.service'
          dpkg-deb --contents "$DEB" | grep -E 'usr/lib/nls-netos/generate-keys.sh'
          dpkg-deb --contents "$DEB" | grep -E 'usr/lib/nls-netos/derive-router-ca-vip.py'
          dpkg-deb --contents "$DEB" | grep -E 'lib/systemd/system/nls-keygen.service'
          dpkg-deb --contents "$DEB" | grep -E 'lib/systemd/system/nls-vip-refresh.service'
          dpkg-deb --contents "$DEB" | grep -E 'lib/systemd/system/nls-vip-refresh.timer'
          dpkg-deb --field "$DEB" Depends | grep -w openssl

      - name: Install package in a clean Ubuntu 24.04 container
        shell: bash
        run: |
          set -euxo pipefail
          DEB="$(find build/packages -name '*.deb' -print -quit)"
          test -n "$DEB"
          docker run --rm --privileged \
            -v "$PWD/build/packages:/packages:ro" \
            ubuntu:24.04 bash -euxc '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y ca-certificates
              apt-get install -y /packages/*.deb
              dpkg --audit
              test -x /usr/lib/frr/zebra
              test -x /usr/lib/frr/ospfd
              test -x /usr/lib/frr/ospf6d
              test -x /usr/bin/vtysh
              ldd /usr/lib/frr/zebra
              ldd /usr/lib/frr/ospfd
              ldd /usr/lib/frr/ospf6d
              /usr/lib/frr/zebra --version
              /usr/lib/frr/ospfd --version
              /usr/lib/frr/ospf6d --version
              getent passwd frr
              getent group frrvty
              test -f /lib/systemd/system/frr.service
              test -x /usr/lib/nls-netos/generate-keys.sh
              test -f /lib/systemd/system/nls-keygen.service
              test -x /usr/lib/nls-netos/derive-router-ca-vip.py
              test -f /lib/systemd/system/nls-vip-refresh.service
              test -f /lib/systemd/system/nls-vip-refresh.timer
              dpkg-query -W openssl
            '

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: nls-netos-frr-deb
          path: build/packages/*.deb
          if-no-files-found: error
