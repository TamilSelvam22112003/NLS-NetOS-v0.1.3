name: NLS cryptographic provisioning checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  key-provisioning:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install shell and crypto test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openssl shellcheck python3-cryptography

      - name: Check shell syntax and lint
        run: |
          bash -n scripts/generate-keys.sh
          bash -n scripts/nls-boot-init.sh
          python3 -m py_compile scripts/generate-router-ca-vip.py
          shellcheck scripts/generate-keys.sh scripts/nls-boot-init.sh

      - name: Test key generation, permissions, and idempotency in temporary path
        run: |
          set -euo pipefail
          TEST_ROOT="$(mktemp -d)"
          trap 'sudo rm -rf "$TEST_ROOT"' EXIT
          sudo install -d -m 0700 "$TEST_ROOT"
          sed "s|/var/lib/nls-netos/crypto|$TEST_ROOT/crypto|g" scripts/generate-keys.sh > "$TEST_ROOT/generate-keys-test.sh"
          sudo chmod 0700 "$TEST_ROOT/generate-keys-test.sh"
          sudo "$TEST_ROOT/generate-keys-test.sh"
          AES="$TEST_ROOT/crypto/aes-256/aes256.key"
          PRIV="$TEST_ROOT/crypto/RSA-2048/private_key.pem"
          PUB="$TEST_ROOT/crypto/RSA-2048/public_key.pem"
          test "$(sudo stat -c %s "$AES")" -eq 32
          test "$(sudo stat -c %a "$AES")" = 600
          test "$(sudo stat -c %a "$PRIV")" = 600
          test "$(sudo stat -c %a "$PUB")" = 644
          sudo openssl pkey -in "$PRIV" -check -noout
          sudo openssl pkey -pubin -in "$PUB" -pubcheck -noout
          BEFORE="$(sudo sha256sum "$AES" "$PRIV" "$PUB")"
          sudo "$TEST_ROOT/generate-keys-test.sh"
          AFTER="$(sudo sha256sum "$AES" "$PRIV" "$PUB")"
          test "$BEFORE" = "$AFTER"

      - name: Validate boot unit and installed scripts
        run: |
          sudo install -D -m 0700 scripts/generate-keys.sh /usr/lib/nls-netos/generate-keys.sh
          sudo install -D -m 0700 scripts/nls-boot-init.sh /usr/lib/nls-netos/nls-boot-init.sh
          sudo install -D -m 0700 scripts/generate-router-ca-vip.py /usr/lib/nls-netos/generate-router-ca-vip.py
          sudo systemd-analyze verify lib/systemd/system/nls-keygen.service
          grep -q 'ExecStart=/usr/lib/nls-netos/nls-boot-init.sh' lib/systemd/system/nls-keygen.service
          grep -q 'nls_service' scripts/nls-boot-init.sh
          grep -q 'service_enabled' scripts/nls-boot-init.sh

      - name: Test Router-CA vIP generation without a certificate
        run: |
          set -euo pipefail
          TEST_ROOT="$(mktemp -d)"
          trap 'sudo rm -rf "$TEST_ROOT"' EXIT
          sudo install -d -o root -g root -m 0700 "$TEST_ROOT/nls-router-ca/home-ca"
          sudo tee "$TEST_ROOT/nls-router-ca/home-ca/root-ca-metadata.json" >/dev/null <<'JSON'
          {
            "schema_version": 1,
            "ca_id": "HOME-CA-CI",
            "ca_type": "HOME",
            "ca_name": "NLS CI Root CA",
            "certificate": {
              "present": false,
              "sha256_fingerprint": null
            },
            "trust": {
              "trust_status": "PENDING",
              "enabled": false,
              "certificate_chain_verified": false
            },
            "management": {
              "last_inspected": "2026-11-08T15:20:00Z"
            }
          }
          JSON
          sudo env NLS_DATA_ROOT="$TEST_ROOT" python3 scripts/generate-router-ca-vip.py
          DIGEST="$TEST_ROOT/crypto/sha-512/r-ca-vip.key"
          RECORD="$TEST_ROOT/nls-router-ca/home-ca/home-ca-vip.json"
          test "$(sudo wc -c < "$DIGEST")" -eq 129
          sudo python3 - "$DIGEST" "$RECORD" <<'PY'
          import ipaddress, json, pathlib, sys
          digest_path, record_path = map(pathlib.Path, sys.argv[1:])
          digest = digest_path.read_text().strip()
          record = json.loads(record_path.read_text())
          address = ipaddress.IPv6Address(record["ipv6_address"])
          assert len(digest) == 128
          int(digest, 16)
          assert address in ipaddress.IPv6Network("2000::/3")
          assert address.exploded == record["ipv6_address"]
          assert record["status"] == "PENDING_TRUST"
          assert record["hash_algorithm"] == "SHA-512"
          assert record["expires_at"] > record["created_at"]
          assert record["ttl_seconds"] == 86400
          assert digest_path.stat().st_mode & 0o777 == 0o600
          assert record_path.stat().st_mode & 0o777 == 0o600
          PY
          BEFORE="$(sudo sha256sum "$DIGEST" "$RECORD")"
          sudo env NLS_DATA_ROOT="$TEST_ROOT" python3 scripts/generate-router-ca-vip.py
          AFTER="$(sudo sha256sum "$DIGEST" "$RECORD")"
          test "$BEFORE" = "$AFTER"

      - name: Ensure no generated keys are tracked
        run: |
          if git ls-files | grep -E '(^|/)(aes256\.key|private_key\.pem|public_key\.pem)$'; then
            echo "Generated key material must not be committed." >&2
            exit 1
          fi
