name: FRR build and OSPFv3 integration

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-ospfv3:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout NLS-NetOS and FRR submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify pinned FRR checkout
        run: |
          test -f third_party/frr/bootstrap.sh
          git -C third_party/frr rev-parse --verify HEAD
          git -C third_party/frr remote get-url origin

      - name: Build upstream FRRouting from source
        run: sudo ./scripts/build-frr.sh

      - name: Verify OSPFv3 build products
        run: |
          test -x build/rootfs/usr/lib/frr/zebra
          test -x build/rootfs/usr/lib/frr/ospf6d
          test -x build/rootfs/usr/bin/vtysh
          LD_LIBRARY_PATH="$PWD/build/rootfs/usr/lib:/usr/local/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" build/rootfs/usr/lib/frr/ospf6d --version

      - name: Install FRR into ephemeral CI runner
        shell: bash
        run: |
          set -euxo pipefail
          sudo groupadd --system frr || true
          sudo groupadd --system frrvty || true
          sudo useradd --system --gid frr --groups frrvty --home-dir /nonexistent --no-create-home --shell /usr/sbin/nologin frr || true
          # Merge only the staged /usr tree; do not overwrite runner-managed
          # mount points such as /var/run or the /lib -> /usr/lib symlink.
          sudo cp -a build/rootfs/usr/. /usr/
          sudo install -d /etc/frr
          sudo cp -a build/rootfs/etc/frr/. /etc/frr/
          if [[ -f build/rootfs/lib/systemd/system/frr.service ]]; then
            sudo install -D -m 0644 build/rootfs/lib/systemd/system/frr.service /lib/systemd/system/frr.service
          fi
          sudo install -d -o frr -g frr -m 0750 /var/run/frr /var/log/frr
          sudo chown -R frr:frr /etc/frr
          sudo chown root:frr /etc/frr/daemons
          sudo chmod 0640 /etc/frr/daemons
          test -x /usr/lib/frr/zebra
          test -x /usr/lib/frr/ospf6d
          test -x /usr/bin/vtysh

      - name: Install topotest dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gdb exabgp iproute2 iputils-ping iptables tcpdump
          python3 -m pip install --break-system-packages pytest pytest-xdist munet scapy psutil "exabgp>=4.2.11,<5" "protobuf<4"

      - name: Run upstream OSPFv3 topology integration test
        run: |
          cd third_party/frr && sudo -E python3 -m pytest -v -s tests/topotests/ospf6_topo1/test_ospf6_topo1.py

      - name: Run NLS-NetOS three-router OSPFv3 regression test
        run: |
          cd third_party/frr/tests/topotests
          sudo -E python3 -m pytest -v -s ../../../../tests/topotests/nls_ospfv3_three_router/test_nls_ospfv3_three_router.py

      - name: Upload OSPFv3 test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frr-ospfv3-topotest-logs
          path: |
            /tmp/topotests/
            third_party/frr/tests/topotests/ospf6_topo1/
            tests/topotests/nls_ospfv3_three_router/
          if-no-files-found: ignore
