name: Linux Self Hosted Runner Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: [self-hosted, linux]

    steps:
      - name: Check Runner
        run: |
          echo "Self-hosted Linux runner is working!"
          echo "Hostname: $(hostname)"
          echo "OS: $(uname -a)"
          echo "User: $(whoami)"

      - name: Check Disk Space
        run: df -h

      - name: Check Memory
        run: free -h

      - name: Test Completed
        run: echo "Runner test successful!"
